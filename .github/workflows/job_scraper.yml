name: Scraper de Trabalho Remoto & Notificador

on:
  schedule:
    - cron: "5 11,23 * * *"
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Verificar o Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Salvar alterações do banco
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(db): atualiza fila de vagas [skip ci]"
          file_pattern: "data/vagas.db"
